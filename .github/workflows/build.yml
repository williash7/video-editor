name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Get whisper.cpp
        run: git clone --depth 1 --branch v1.8.7 https://github.com/ggml-org/whisper.cpp app/src/main/cpp/whisper.cpp

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|> .*" build.log | grep -v "^> Task" | head -45 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk video-editor.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "גרסה 1.0.${{ github.run_number }}"
          body: "להתקנה: להוריד את video-editor.apk ולפתוח אותו בטלפון."
          files: video-editor.apk
          make_latest: true
